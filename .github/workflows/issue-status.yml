name: Project status

on:
  push:

permissions:
  contents: read
  issues: read

jobs:
  project-info:
    runs-on: ubuntu-latest

    steps:
      - name: Tester l'accès au Project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          gh project view 11 \
            --owner DimitriGerson \
            --format json
