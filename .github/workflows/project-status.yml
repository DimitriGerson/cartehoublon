
name: Issue status

on:
  issues:
    types: [assigned]

permissions:
  issues: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Passer de Ready à In progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "Ready" \
            --add-label "In progress"
