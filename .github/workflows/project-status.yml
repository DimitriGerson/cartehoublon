name: Issue status

on:
  push:

permissions:
  issues: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Passer de Ready à In progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: 15
        run: |
          if gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -Fxq "Ready"; then
            gh issue edit "$ISSUE_NUMBER" \
              --remove-label "Ready" \
              --add-label "In progress"
          fi
