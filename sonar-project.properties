sonar.projectKey=DimitriGerson_cartehoublon
sonar.organization=dimitrigerson

# Code à analyser
sonar.sources=app,static

# Tests
sonar.tests=tests

# Couverture Python générée par pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/venv/**,legacy/**

# Encodage
sonar.sourceEncoding=UTF-8
