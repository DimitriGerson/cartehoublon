services:

  postgres-test:

    image: postgres:17

    container_name: postgres-test

    environment:
      POSTGRES_DB: houblon_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test

    ports:
      - "5433:5432"

    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
